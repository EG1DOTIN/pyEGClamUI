[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyegclamui"
version = "3.0.0"
description = "An open-source, cross-platform desktop GUI for ClamAV"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "EG1 ( eg1.in )" }
]
keywords = [
    "clamav",
    "antivirus",
    "gui",
    "security",
    "malware-scanner",
    "pyside6",
    "pyegclamui",
    "desktop"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "PySide6>=6.5.0",
    "clamd>=1.0.2",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "send2trash>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
pyegclamui-scan = "pyegclamui.core.scanner:cli_main"
pyegclamui-setup = "pyegclamui.core.setup_engine:cli_main"
egclam = "pyegclamui.gui.app:main"

[project.gui-scripts]
pyegclamui = "pyegclamui.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyegclamui = ["assets/**/*", "assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
