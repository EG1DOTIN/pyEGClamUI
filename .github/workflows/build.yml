name: Build & Package pyEGClamUI

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: "Publish built packages to GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-x64
            artifact_path: |
              dist/*.exe
              dist/*.zip
          - os: ubuntu-latest
            artifact_name: linux-x86_64
            artifact_path: |
              dist/*.tar.gz
          - os: macos-latest
            artifact_name: macos
            artifact_path: |
              dist/*.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Inno Setup Compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress

      - name: Install Linux system dependencies (Qt runtime)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pyinstaller pillow

      - name: Run unit test suite & verify checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -s -vv --durations=10 tests/

      - name: Build Windows Inno Setup Installer & Portable Bundle
        if: runner.os == 'Windows'
        run: |
          python scripts/package_windows_installer.py --compile
          python scripts/build.py --clean

      - name: Compile Linux and macOS Packages
        if: runner.os != 'Windows'
        run: |
          python scripts/build.py --clean

      - name: Verify Distributable Artifacts Integrity
        shell: bash
        run: |
          echo "=== Built Packages in dist/ ==="
          ls -lh dist/
          count=$(ls -1 dist/ | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "Error: No build artifacts found in dist/"
            exit 1
          fi
          for f in dist/*; do
            if [ -f "$f" ]; then
              size=$(wc -c < "$f")
              if [ "$size" -lt 1048576 ]; then
                echo "Error: Artifact $f is too small ($size bytes)"
                exit 1
              fi
              echo "Valid package: $f ($size bytes)"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyegclamui-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd release_artifacts
          echo "=== Release Artifacts ==="
          ls -lh
          echo "=== SHA-256 Hashes ==="
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
